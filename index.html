<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal E-Commerce</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f7f7f7;
            color: #222;
        }

        header {
            background: white;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
        }

        header h1 {
            font-size: 24px;
        }

        .cart {
            font-size: 18px;
            cursor: pointer;
        }

        .hero {
            text-align: center;
            padding: 40px 20px;
        }

        .hero h2 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .hero p {
            color: #666;
        }

        .search {
            display: block;
            width: 80%;
            max-width: 500px;
            margin: 0 auto 30px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .products {
            width: 85%;
            max-width: 1100px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .product {
            background: white;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #ddd;
        }

        .product img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
        }

        .product h3 {
            margin: 12px 0 6px;
        }

        .price {
            font-weight: bold;
            margin-bottom: 12px;
        }

        button {
            border: none;
            background: #111;
            color: white;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #333;
        }

        #cartBox {
            position: fixed;
            right: 20px;
            top: 70px;
            width: 300px;
            background: white;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            display: none;
            box-shadow: 0 5px 20px #0002;
        }

        #cartItems {
            margin: 15px 0;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        .checkout {
            width: 100%;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<header>
    <h1>ShopEasy</h1>

    <div class="cart" onclick="toggleCart()">
        🛒 Cart (<span id="cartCount">0</span>)
    </div>
</header>

<section class="hero">
    <h2>Simple Shopping</h2>
    <p>Find your favorite products.</p>
</section>

<input
    type="text"
    id="search"
    class="search"
    placeholder="Search products..."
    onkeyup="searchProducts()"
>

<div class="products" id="products">

    <div class="product" data-name="T-Shirt">
        <img src="https://picsum.photos/400/300?random=1">
        <h3>T-Shirt</h3>
        <p class="price">₹499</p>
        <button onclick="addToCart('T-Shirt', 499)">Add to Cart</button>
    </div>

    <div class="product" data-name="Shoes">
        <img src="https://picsum.photos/400/300?random=2">
        <h3>Shoes</h3>
        <p class="price">₹1,499</p>
        <button onclick="addToCart('Shoes', 1499)">Add to Cart</button>
    </div>

    <div class="product" data-name="Watch">
        <img src="https://picsum.photos/400/300?random=3">
        <h3>Watch</h3>
        <p class="price">₹999</p>
        <button onclick="addToCart('Watch', 999)">Add to Cart</button>
    </div>

    <div class="product" data-name="Backpack">
        <img src="https://picsum.photos/400/300?random=4">
        <h3>Backpack</h3>
        <p class="price">₹799</p>
        <button onclick="addToCart('Backpack', 799)">Add to Cart</button>
    </div>

</div>

<div id="cartBox">
    <h2>Your Cart</h2>

    <div id="cartItems">
        Cart is empty
    </div>

    <h3>Total: ₹<span id="total">0</span></h3>

    <button class="checkout" onclick="checkout()">
        Checkout
    </button>
</div>

<script>
    let cart = [];

    function addToCart(name, price) {
        cart.push({
            name: name,
            price: price
        });

        updateCart();
    }

    function updateCart() {
        document.getElementById("cartCount").innerText = cart.length;

        let items = document.getElementById("cartItems");
        let total = 0;

        if (cart.length === 0) {
            items.innerHTML = "Cart is empty";
        } else {
            items.innerHTML = "";

            cart.forEach((item, index) => {
                total += item.price;

                items.innerHTML += `
                    <div class="cart-item">
                        <span>${item.name}</span>
                        <span>
                            ₹${item.price}
                            <button onclick="removeItem(${index})">×</button>
                        </span>
                    </div>
                `;
            });
        }

        document.getElementById("total").innerText = total;
    }

    function removeItem(index) {
        cart.splice(index, 1);
        updateCart();
    }

    function toggleCart() {
        let cartBox = document.getElementById("cartBox");

        if (cartBox.style.display === "block") {
            cartBox.style.display = "none";
        } else {
            cartBox.style.display = "block";
        }
    }

    function searchProducts() {
        let search = document
            .getElementById("search")
            .value
            .toLowerCase();

        let products = document.querySelectorAll(".product");

        products.forEach(product => {
            let name = product.dataset.name.toLowerCase();

            if (name.includes(search)) {
                product.style.display = "block";
            } else {
                product.style.display = "none";
            }
        });
    }

    function checkout() {
        if (cart.length === 0) {
            alert("Your cart is empty!");
        } else {
            alert("Order placed successfully!");
            cart = [];
            updateCart();
        }
    }
</script>

</body>
</html>
